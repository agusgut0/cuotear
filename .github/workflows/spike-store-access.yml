name: Spike - store access

# Temporary spike: checks whether stores answer GitHub-hosted runners (datacenter IPs)
# and whether prices can be extracted. Manual only; no secrets; read-only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run store access spike
        run: node scripts/spike/store-access.mjs --label actions --out spike-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-access-actions
          path: spike-results/
          if-no-files-found: warn
          retention-days: 14
