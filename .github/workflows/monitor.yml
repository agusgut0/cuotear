name: Monitor

# Measures the prices every 6 hours, records the history, builds the static
# site and publishes it to GitHub Pages (DRT 10.1, ADR-0005). The run is also
# available on demand; with `dry_run` it measures and builds but writes no
# history, saves no state, makes no commit and does not deploy.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Measure and build the site without committing, saving state or deploying'
        type: boolean
        default: false

permissions: {}

# Never two runs at once: they share the run state and push to the same branch.
concurrency:
  group: cuotear-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push of the data/history commit (issues: write arrives with the ops notices)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history commit is rebased onto the remote branch
          persist-credentials: false # the token is only given to the commit step
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore the run state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: cuotear-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cuotear-state-
      - name: Measure, record and build the site
        id: measure
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node src/cli/run.js --dry-run
          else
            node src/cli/run.js
          fi
      - name: Commit the history
        if: ${{ !cancelled() && steps.measure.outcome == 'success' && !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node src/cli/commit.js
      - name: Save the run state
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: cuotear-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the site
        if: ${{ !cancelled() && steps.measure.outcome == 'success' && !inputs.dry_run }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    needs: run
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
