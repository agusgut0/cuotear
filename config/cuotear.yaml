# yaml-language-server: $schema=./cuotear.schema.json
version: 1
alertas:
  canal: telegram # telegram | ninguno
  idioma: es-AR # es-AR | en
  reglas: # globales; cada producto puede reemplazar por regla
    baja_minima_pct: 5
    cambio_mejor_opcion: true
